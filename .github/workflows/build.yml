name: Build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x64)
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: delikan
            asset: delikan-linux-x64
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            binary: delikan
            asset: delikan-macos-arm64
          - name: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: delikan.exe
            asset: delikan-windows-x64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Standalone executable only: no installer. yt-dlp and deno are downloaded by the app at runtime.
      - name: Build app
        run: npm run tauri build -- --target ${{ matrix.target }} --no-bundle

      - name: Collect binary
        shell: bash
        run: |
          mkdir -p dist
          cp "src-tauri/target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.asset }}"

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}
          generate_release_notes: true
          fail_on_unmatched_files: true
